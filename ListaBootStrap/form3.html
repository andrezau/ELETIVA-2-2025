<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3 class="text-center mb-4">Sample Form</h3>
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="partnerName" class="form-label">Partner Name</label>
                    <input type="text" class="form-control" id="partnerName" placeholder="">
                </div>
                <div class="col-md-6">
                    <label for="partnerEmail" class="form-label">Partner Email ID</label>
                    <input type="email" class="form-control" id="partnerEmail" placeholder="">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="partnerLegal" class="form-label">Partner Legal Name</label>
                    <input type="text" class="form-control" id="partnerLegal" placeholder="">
                </div>
                <div class="col-md-6">
                    <label for="partnerMobile" class="form-label">Partner Mobile</label>
                    <input type="tel" class="form-control" id="partnerMobile" placeholder="">
                </div>
            </div>

            <div class="mb-3">
                <label for="partnerAddress" class="form-label">Partner Address</label>
                <input type="text" class="form-control" id="partnerAddress" placeholder="">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="contractStart" class="form-label">Contract Start Date</label>
                    <input type="date" class="form-control" id="contractStart">
                </div>
                <div class="col-md-6">
                    <label for="contractEnd" class="form-label">Contract Expiry Date</label>
                    <input type="date" class="form-control" id="contractEnd">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="minLoan" class="form-label">Minimum Loan Amount</label>
                    <input type="number" class="form-control" id="minLoan" placeholder="">
                </div>
                <div class="col-md-6">
                    <label for="maxLoan" class="form-label">Maximum Loan Amount</label>
                    <input type="number" class="form-control" id="maxLoan" placeholder="">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="interestRate" class="form-label">Interest Rate</label>
                    <input type="number" step="0.01" class="form-control" id="interestRate" placeholder="">
                </div>
                <div class="col-md-6">
                    <label for="depositAmount" class="form-label">Deposit Amount</label>
                    <input type="number" class="form-control" id="depositAmount" placeholder="">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</body>
</html>
